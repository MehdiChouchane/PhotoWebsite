<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prénom Nom — Photographie</title>
    <meta

        content="Portfolio photographique de Prénom Nom."

    <link rel="stylesheet" href="css/style.css">

<body>

    <header>

        </nav>
    </header>

    <main>

        <section class="hero">

                <a href="#portfolio" class="button">

            <div class="section-header">
                <p class="eyebrow">Sélection</p>

            <div class="gallery">

                <figure>
                    <img

                    >
                </figure>

                <figure>
                    <img
                        src="images/portfolio/photo-02.jpg"

                    >

                <figure>
                    <img
                        src="images/portfolio/photo-03.jpg"
                        alt="Description de la photographie"
                    >
                </figure>

            </div>
        </section>

        <section id="about" class="about">
            <p class="eyebrow">À propos</p>
            <h2>Quelques mots sur moi</h2>
            <p>
                Je suis Prénom Nom, photographe basé à ...
                Je photographie principalement ...
            </p>
        </section>

        <section id="contact" class="contact">
            <p class="eyebrow">Contact</p>
            <h2>Travaillons ensemble.</h2>
            <a href="mailto:ton@email.com">
                ton@email.com
            </a>
        </section>

    </main>

    <footer>
        <p>© 2026 Prénom Nom</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
